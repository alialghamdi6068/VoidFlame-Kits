name: VoidFlame-Kits
version: 1.0.0
main: net.voidflame.kits.VoidFlameKitsPlugin
description: Kits module for VoidFlame MC.
author: VoidFlame
website: https://github.com/alialghamdi6068/VoidFlame-Kits
api-version: '26.2'
load: POSTWORLD
depend: [VoidFlame-Core]

commands:
  kit:
    description: Apply a VoidFlame kit.
    usage: /kit <name|list|editor <kit> [layout]>
    permission: voidflame.kits
  kits:
    description: List VoidFlame kits.
    usage: /kits
    permission: voidflame.kits
  kitadmin:
    description: Open the VoidFlame kit administration GUI.
    usage: /kitadmin [gui]
    permission: voidflame.kits.manage

permissions:
  voidflame.kits:
    description: Use practice kits.
    default: true
  voidflame.kits.edit:
    description: Edit personal kit layouts.
    default: true
  voidflame.kits.manage:
    description: Create, edit and delete server kits.
    default: op
